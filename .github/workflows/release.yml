name: Release Obsidian plugin

# 两种触发方式（任选其一，效果相同）：
#   1) 推送一个版本号标签：git push origin 1.1.0  → 自动发版，零点击
#   2) 仓库 Actions 页手动点 "Run workflow"        → 自动读版本号、打标签、发版
# 附件只放官方要求的三个文件：main.js / manifest.json / styles.css
# release 正文自动取 CHANGELOG.md 里对应版本那一节（改更新说明只改那一个文件）
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: ver
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # 标签推送触发时：确认标签名和 manifest 里的版本号一致，
      # 防止推错标签（如手滑推了个 test）发出错误版本
      - name: Verify tag matches manifest version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '${{ steps.ver.outputs.version }}'. Push the correct tag or bump the version first."
            exit 1
          fi

      # 以下两步只在手动触发时需要（标签推送时标签已存在，不能再建）
      - name: Fail if tag already exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "::error::Tag ${{ steps.ver.outputs.version }} already exists. Bump the version in manifest.json for a new release."
            exit 1
          fi

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.version }}"
          git push origin "refs/tags/${{ steps.ver.outputs.version }}"

      # 更新说明只维护一处：CHANGELOG.md。发版时把对应版本那一节抠出来当 release 正文。
      # 抠不到（文件不在、或版本号忘了写进去）就退回原来的通用正文，绝不发空。
      # 注意：下面 heredoc 的内容行必须保持在 run 块的缩进层里（10 个空格），
      # 顶到行首会把 YAML 块标量截断，整条流水线直接读不出来。
      - name: Build release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          notes=/tmp/notes.md
          footer=/tmp/footer.md
          cat > "$footer" <<'FOOTER'
          
          Install via Obsidian community plugin directory, or manually download
          `main.js`, `manifest.json` and `styles.css` into
          `<vault>/.obsidian/plugins/aio-explorer/`.
          FOOTER
          sed -i -e 's/[[:space:]]*$//' "$footer"
          : > /tmp/section.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" 'BEGIN{CR=sprintf("%c",13)} { sub(CR "$", "") } /^## / { if (found) exit; split($0, a, " "); found = (a[2] == ver); next } found { print }' CHANGELOG.md > /tmp/section.md
            sed -i -e '/./,$!d' /tmp/section.md
          fi
          {
            if [ -s /tmp/section.md ]; then
              cat /tmp/section.md
              cat "$footer"
            else
              echo "::warning::CHANGELOG.md 里没有 $VERSION 这一节，release 正文退回默认说明。" >&2
              echo "Aio Explorer $VERSION"
              cat "$footer"
            fi
          } > "$notes"
          {
            echo "body<<NOTES_EOF"
            cat "$notes"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release with the three plugin files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Aio Explorer ${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            main.js
            manifest.json
            styles.css
